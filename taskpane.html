<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onglets verticaux</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css?v=2">
</head>
<body>
  <header class="bar">
    <div class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="filter" type="search" placeholder="Rechercher" autocomplete="off" spellcheck="false">
    </div>
    <button id="add" class="icon-btn" title="Ajouter" aria-label="Ajouter">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
    </button>
  </header>
  <div id="tags" class="tagbar" hidden></div>
  <div id="tree" class="tree" tabindex="0" role="tree" aria-label="Feuilles du classeur"></div>
  <footer class="foot">
    <label class="toggle"><input id="showHidden" type="checkbox"><span>Feuilles masquées</span></label>
    <span id="count" class="count"></span>
  </footer>
  <div id="menu" class="menu" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="taskpane.js?v=2"></script>
</body>
</html>
